<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sam · Fortaleza do Dragão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Silkscreen&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0b0a09;color:#f3ead8;font-family:Lora,Georgia,serif;min-height:100%;overflow:hidden}
a{color:#f0c46a;text-decoration:none}a:hover{color:#fff1a8}
header{display:flex;align-items:center;gap:16px;padding:16px 28px;border-bottom:1px solid #24211c;flex-wrap:wrap}
.title{font-family:Silkscreen,monospace;font-size:24px;letter-spacing:.32em}
.title b{color:#e8b923;font-weight:400}
.sub{font-size:13px;color:#a99a7a;margin-top:2px}
.tabs{margin-left:auto;display:flex;gap:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:#15120f;border:1px solid #6b4f22;color:#d9cdb4;font:500 12px/1 Lora,serif;letter-spacing:.12em;text-transform:uppercase;padding:7px 10px;border-radius:2px;white-space:nowrap}
.tab:hover{border-color:#c8963a;color:#fff1a8}
.tab.on{border-color:#f0c46a;color:#fff1a8;background:#2b2318}
main{display:block;padding:0}
#game{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:3px solid #c8963a;box-shadow:inset 0 0 0 2px #3a2c14;border-radius:0;background:#000;user-select:none;-webkit-user-select:none;font-size:16px}
#scene{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.px{font-family:Silkscreen,monospace;letter-spacing:.06em;text-transform:uppercase}
.hud{position:absolute;background:#15120f;border:.15em solid #c8963a;box-shadow:inset 0 0 0 .14em #15120f,inset 0 0 0 .22em #6b4f22,0 .3em .9em rgba(0,0,0,.55);border-radius:.2em;color:#f3ead8;padding:.7em .9em}
.hud::before,.hud::after{content:"";position:absolute;top:-.4em;width:.55em;height:.55em;background:#15120f;border:.13em solid #c8963a;transform:rotate(45deg)}
.hud::before{left:-.4em}.hud::after{right:-.4em}
.ttl{position:absolute;left:50%;top:-.85em;transform:translateX(-50%);background:#15120f;border:.12em solid #c8963a;padding:.25em .7em;font-size:.72em;color:#f0c46a;white-space:nowrap}
#quest{top:3%;left:1.6%;width:23%;padding-top:1em}
#quest ol{list-style:none;display:flex;flex-direction:column;gap:.35em;font-size:.82em}
#quest li{display:flex;gap:.5em;align-items:center;color:#8a7f6a}
#quest li i{width:.8em;height:.8em;border:.12em solid #6b4f22;flex:none;font-style:normal;display:grid;place-items:center;font-size:.7em}
#quest li.now{color:#fff1a8}#quest li.now i{border-color:#f0c46a}
#quest li.done{color:#cfe8b4}#quest li.done i{border-color:#6fbf4e;background:#2f4a22}#quest li.done i::after{content:"✓";color:#cfe8b4}
#qs{margin-top:.55em;font-size:.72em;color:#a99a7a}
#cx{margin-top:.3em;font-size:.62em;color:#e0431a}#cx:empty{display:none}
#boss{top:3%;left:50%;transform:translateX(-50%);width:34%;padding:.55em .9em .6em}
.brow{display:flex;justify-content:space-between;align-items:baseline;gap:.6em;font-size:.8em}
.brow b{color:#f0c46a;font-weight:400}
#bst{font-size:.85em}
.bar{margin-top:.4em;height:.7em;background:#2a1a14;border:.1em solid #0b0a09;outline:.1em solid #6b4f22;position:relative}
#bhp{position:absolute;left:0;top:0;bottom:0;width:100%;background:#c8251a;box-shadow:inset 0 .18em 0 #ff6a4a;transition:width .25s}
#bnum{position:absolute;right:.3em;top:50%;transform:translateY(-50%);font-size:.6em;color:#fff}
#mapbox{top:3%;right:1.6%;width:16%;padding:.35em}
#mini{display:block;width:100%;image-rendering:pixelated}
#bottom{position:absolute;left:1.6%;right:1.6%;bottom:2.6%;display:flex;gap:1.4%;height:19%}
#bottom .hud{position:relative}
#party{width:27%;display:flex;flex-direction:column;justify-content:space-between;padding:.55em .75em}
.pm{display:grid;grid-template-columns:1.5em 1fr 2.2em;gap:.5em;align-items:center}
.pm canvas{width:1.5em;height:1.5em;image-rendering:pixelated;border:.08em solid #6b4f22}
.pn{display:flex;flex-direction:column;gap:.18em;font-size:.66em}
.pn i{display:block;height:.55em;background:#2a2420;border:.1em solid #0b0a09}
.pn u{display:block;height:100%;width:100%;transition:width .25s}
.hpn{font-size:.66em;text-align:right;color:#f3ead8}
.pm.ko{opacity:.55}.pm.ko .hpn{color:#ff6a4a}
#dlg{flex:1;display:flex;align-items:center;padding:.9em 1.2em}
#who{position:absolute;left:1em;top:-.85em;background:#15120f;border:.12em solid #c8963a;padding:.25em .7em;font-size:.72em;color:#f0c46a}
#txt{font-size:1.02em;line-height:1.45;text-wrap:pretty}
#caret{color:#e0431a;margin-left:.4em;font-size:.75em}
#cmds{width:20%;display:flex;flex-direction:column;justify-content:space-between;padding:.45em .5em}
#cmds button{position:relative;display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:#f3ead8;font:inherit;font-family:Silkscreen,monospace;text-transform:uppercase;letter-spacing:.06em;font-size:.72em;padding:.3em .4em .3em 1.2em;cursor:pointer;border-radius:.15em;overflow:hidden}
#cmds button::before{content:"▶";position:absolute;left:.25em;color:#f0c46a;opacity:0;font-size:.85em}
#cmds button:hover,#cmds button:focus-visible{background:rgba(200,150,58,.14);color:#fff1a8;outline:none}
#cmds button:hover::before,#cmds button:focus-visible::before{opacity:1}
#cmds button:active{background:rgba(200,150,58,.26)}
#cmds button:disabled{opacity:.4;cursor:default;background:none}
#cmds button:disabled::before{opacity:0}
#cmds kbd{font:inherit;color:#a99a7a}
.cd{position:absolute;left:0;bottom:0;height:.12em;background:#c8963a}
#banner{position:absolute;left:0;right:0;top:36%;text-align:center;font-family:Silkscreen,monospace;font-size:2.6em;letter-spacing:.12em;text-transform:uppercase;color:#f0c46a;text-shadow:.08em .08em 0 #3a2410,0 0 .5em rgba(240,196,106,.5);opacity:0;pointer-events:none}
#banner.show{animation:bn 2.6s ease-out forwards}
@keyframes bn{0%{opacity:0;transform:scale(1.4)}12%{opacity:1;transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-.4em)}}
@media (max-width:640px){header{padding:12px 14px}.title{font-size:16px}}
</style>
</head>
<body>
<main>
  <div id="game">
    <canvas id="scene" width="480" height="270"></canvas>
    <div class="hud" id="quest">
      <span class="ttl px">Missão</span>
      <ol>
        <li class="px" style="color:#f0c46a;font-size:.8em;margin-bottom:.1em">Envio ao VIOS</li>
        <li id="q1"><i></i><b>TXT recebido</b></li>
        <li id="q2"><i></i><b>CIs conferidas</b></li>
        <li id="q3"><i></i><b>Duplicatas conferidas</b></li>

      <div id="qs" class="px"></div><div id="cx" class="px"></div>
    </div>
    <div class="hud" id="boss">

      <div class="bar"><div id="bhp"></div><span id="bnum" class="px">120/120</span></div>
    </div>
    <div class="hud" id="mapbox"><span class="ttl px">Mapa</span><canvas id="mini" width="160" height="100"></canvas></div>
    <div id="bottom">

      <div class="hud" id="dlg"><span id="who" class="px">Guia</span><p id="txt"></p></div>
      <div class="hud" id="cmds">
        <button id="c-atk">Atacar<kbd>1</kbd><span class="cd" id="cd-atk"></span></button>
        <button id="c-mag">Magia<kbd>2</kbd><span class="cd" id="cd-mag"></span></button>
        <button id="c-esc">Escudo<kbd>3</kbd><span class="cd" id="cd-esc"></span></button>
        <button id="c-sim">Demonstração<kbd>4</kbd></button>
      </div>
    </div>
    <div id="banner"></div>
  </div>
</main>
<script>
// Fortaleza do Dragão — cena lateral em pixel art (480x270)
const W=480,H=270;
const $=id=>document.getElementById(id);
const cv=$('scene'),c=cv.getContext('2d');c.imageSmoothingEnabled=false;

  for(let i=0;i<5;i++){const t=.3+i*.12;ln(k,px+w*t*.6,base-h*(1-t),px+w*t*.9,base-h*(1-t)+h*.18,cd);}
  if(snow){const sy=base-h*.58,sw=w*.42;tri(k,px-sw,sy,px+sw,sy,px,base-h,'#e9eef6');tri(k,px,sy,px+sw,sy,px,base-h,'#bfcbe0');
    for(let j=-2;j<=2;j++)tri(k,px+j*sw*.4-3,sy-.5,px+j*sw*.4+3,sy-.5,px+j*sw*.4,sy+5+(j%2?3:0),j>0?'#bfcbe0':'#e9eef6');}}
function pine(k,x,y,s,c1,c2){R(k,x-1,y-2,2,2,'#3a2a1a');for(let t=0;t<3;t++){const cy=y-2-t*s*1.5,hw=(3-t)*s*.85+1;tri(k,x-hw,cy,x+hw,cy,x,cy-s*2.3,c1);tri(k,x,cy,x+hw,cy,x,cy-s*2.3,c2);}}
const CL=[[0,190],[30,188],[60,190],[95,187],[130,189],[165,187],[195,190],[214,197],[226,212],[232,270]];
const groundY=x=>{for(let i=1;i<CL.length;i++)if(x<=CL[i][0]){const a=CL[i-1],b=CL[i];return a[1]+(b[1]-a[1])*(x-a[0])/(b[0]-a[0]);}return 270;};
const SLEEP_CP=[[334,150],[348,145],[366,140],[388,138],[410,141],[428,148],[442,158],[454,166],[468,170]];
function buildScene(){
  const bands=['#22336a','#2b417c','#36508e','#44619f','#5574b0','#6a89c0','#83a2d1','#9dbbe0','#b6d0ec'];
  bands.forEach((col,i)=>{R(sk,0,i*16,W,17,col);if(i)for(let x=0;x<W;x+=2){R(sk,x+(i%2),i*16,1,1,bands[i-1]);R(sk,x+1-(i%2),i*16+1,1,1,bands[i-1]);}});
  R(sk,0,144,W,H-144,bands[8]);
  [[10,92,30],[52,76,34],[96,96,30],[140,64,38],[188,88,32],[236,78,30]].forEach(([x,h,w])=>mountain(g,x,150,h,w,'#56638a','#46527a',true));

  g.fillStyle='#2e4a45';g.beginPath();g.moveTo(0,200);for(let x=0;x<=260;x+=4)g.lineTo(x,160+Math.sin(x*.05)*5+Math.sin(x*.13)*3);g.lineTo(260,200);g.closePath();g.fill();
  for(let x=0;x<260;x+=5)pine(g,x+rnd()*3,163+Math.sin(x*.05)*5+rnd()*6,2,'#27413c','#1f3530');
  for(let x=0;x<250;x+=6)pine(g,x+rnd()*4,182+rnd()*8,3,'#1f3a33','#18302a');
  g.fillStyle='#3a3f4c';g.beginPath();g.moveTo(168,180);g.lineTo(200,140);g.lineTo(226,96);g.lineTo(252,44);g.lineTo(278,0);g.lineTo(W,0);g.lineTo(W,182);g.closePath();g.fill();
  for(let i=0;i<500;i++){const x=200+rnd()*280,y=rnd()*180;R(g,x,y,1+rnd()*5,1,rnd()<.5?'#343845':'#4a505e');}
  [[252,44],[226,96],[200,140]].forEach(([x,y])=>ln(g,x,y,x+30,y-50,'#4f5564'));
  for(let i=0;i<10;i++)pine(g,256+rnd()*40,40+rnd()*60,2,'#2a4a3a','#203a2e');
  R(g,290,26,190,28,SD[3]);stone(g,290,30,190,24,SD);merlons(g,290,30,190,SD);
  [[298,8,16,54,1],[322,-6,20,54,0],[350,10,16,54,1],[372,-10,22,54,0],[400,4,18,54,1],[426,-4,20,54,0],[452,8,18,54,1]].forEach(([x,t,w,b,r])=>tower(g,x,t,w,b,r,SD));

  tower(g,180,104,18,178,1,ST);tower(g,206,72,22,178,1,ST);tower(g,238,40,26,178,1,ST);tower(g,272,62,20,178,0,ST);
  [[190,140],[222,132],[258,128],[286,140]].forEach(([x,y])=>{R(g,x,y,2,6,'#2a1a0c');});
  stone(g,294,50,184,128,SD);R(g,294,50,184,3,'#c8963a');R(g,294,53,184,1,'#8a5a1e');
  g.save();g.beginPath();g.moveTo(304,176);g.lineTo(304,100);g.ellipse(385,100,81,40,0,Math.PI,0);g.lineTo(466,176);g.closePath();g.clip();
  const gr=g.createRadialGradient(385,150,4,385,140,130);gr.addColorStop(0,'#ffe199');gr.addColorStop(.35,'#f0a83a');gr.addColorStop(.7,'#a8581a');gr.addColorStop(1,'#3a1d08');g.fillStyle=gr;g.fillRect(300,56,170,122);
  for(let i=0;i<3;i++){const ax=318+i*52;g.strokeStyle='#b68235';g.lineWidth=2;g.beginPath();g.ellipse(ax+26,98,22,16,0,Math.PI,0);g.stroke();}
  [320,352,418,450].forEach(x=>{R(g,x,82,7,90,'#c8963a');R(g,x,82,2,90,'#f0c46a');R(g,x+5,82,2,90,'#8a5a1e');R(g,x-2,80,11,4,'#f0c46a');R(g,x-2,84,11,1,'#8a5a1e');});
  for(let i=0;i<40;i++)R(g,310+rnd()*150,70+rnd()*40,1,1,'#ffe9b0');
  g.restore();
  g.strokeStyle='#8a5a1e';g.lineWidth=4;g.beginPath();g.ellipse(385,100,82,41,0,Math.PI,0);g.stroke();
  g.strokeStyle='#c8963a';g.lineWidth=2;g.beginPath();g.ellipse(385,100,82,41,0,Math.PI,0);g.stroke();
  g.strokeStyle='#f0c46a';g.lineWidth=1;g.beginPath();g.ellipse(385,100,79,38,0,Math.PI,0);g.stroke();
  [[302,100],[466,100]].forEach(([x,y])=>{R(g,x-2,y,4,76,'#c8963a');R(g,x-2,y,1,76,'#f0c46a');});
  poly(g,[[385,52],[391,60],[385,68],[379,60]],'#c8963a');poly(g,[[385,55],[388,60],[385,65],[382,60]],'#f0c46a');
  g.fillStyle='#c8961e';g.beginPath();g.moveTo(304,178);for(let x=304;x<=468;x+=2){const t=(x-304)/164;g.lineTo(x,176-Math.sin(t*Math.PI)*30-Math.sin(t*9)*2);}g.lineTo(468,178);g.closePath();g.fill();
  for(let i=0;i<2600;i++){const x=306+rnd()*160,t=(x-304)/164,top=176-Math.sin(t*Math.PI)*30,y=top+rnd()*(178-top);const v=rnd()*(1-(y-top)/40);R(g,x,y,1,1,v>.55?'#fff1a8':v>.3?'#f0c46a':v>.12?'#e8b923':'#b68235');}
  [[356,160,'#c8102e'],[400,156,'#3d8bff'],[430,166,'#3fbf6a'],[372,170,'#c8102e'],[446,170,'#3d8bff']].forEach(([x,y,col])=>{R(g,x,y,2,2,col);R(g,x,y,1,1,'#fff');});
  [[342,164],[420,158]].forEach(([x,y])=>{R(g,x,y,12,8,'#7a4a1e');R(g,x,y,12,2,'#9a6a2e');R(g,x,y+3,12,1,'#c8963a');R(g,x+5,y+4,2,2,'#f0c46a');R(g,x,y,1,8,'#c8963a');R(g,x+11,y,1,8,'#c8963a');});
  R(g,376,150,8,3,'#e8b923');[376,379,382].forEach(x=>R(g,x,148,1,2,'#e8b923'));R(g,379,150,2,1,'#c8102e');
  [[282,128],[464,128]].forEach(([x,y])=>{stone(g,x,y+40,18,10,ST);R(g,x+3,y+8,12,32,'#8a8f9c');R(g,x+3,y+8,2,32,'#a3a9b5');R(g,x+12,y+8,3,32,'#737884');R(g,x+4,y,10,9,'#9aa0a8');R(g,x+4,y,10,2,'#b8bec6');

function startSim(){if(sim||emEnvio())return;sim={step:0,t:0,dmg:0,tasks:0};$('q4').querySelector('b').textContent='Tarefas criadas 0/3';}
function nx(){sim.step++;sim.t=0;}
function updSim(){if(!sim)return;sim.t++;const[hal,arc,dwa,wiz]=heroes;
  switch(sim.step){
    case 0:quest(0,'Envio em andamento');say(hal.name,'Chegou um TXT na Doca 01. Abrindo o pergaminho...');nx();break;
    case 1:if(sim.t>170){quest(1);say(arc.name,'Conferi o pergaminho: 3 CIs prontas, nenhuma com problema.');nx();}break;
    case 2:if(sim.t>170){quest(2);say(dwa.name,'Portões da Torre VIOS abertos. Rumo ao quadro!');nx();}break;
    case 3:if(sim.t>170){quest(3);say(wiz.name,'Nenhuma duplicata. Desperte, guardião!');nx();}break;
    case 4:if(sim.t>110){if(D.st==='sleep')wake();D.hp=D.max;nx();}break;
    case 5:{const t=Math.min(3,Math.floor(sim.dmg/36));if(t>sim.tasks){sim.tasks=t;$('q4').querySelector('b').textContent='Tarefas criadas '+t+'/3';banner('Tarefa '+t+'/3 criada');say(heroes[t].name,'Tarefa '+t+'/3 gravada e conferida no VIOS.');}
      if(t>=3){setSt('return');D.target=null;quest(4,'Concluído · 3 tarefas no VIOS');banner('Missão cumprida');say('Torre VIOS','Três tarefas no quadro. Volto a guardar a torre.');nx();}}break;
    case 6:if(sim.t>420){sim=null;D.hp=D.max;quest(-1,'Aguardando envio');$('q4').querySelector('b').textContent='Tarefas criadas';}break;
  }}
const party=$('party');
heroes.forEach((h,i)=>{const row=document.createElement('div');row.className='pm';row.innerHTML=`<canvas width="22" height="22"></canvas><div class="pn"><span class="px">${h.name}</span><i><u></u></i></div><span class="hpn px">100</span>`;party.appendChild(row);
  const k=row.querySelector('canvas').getContext('2d');R(k,0,0,22,22,'#2a2420');h.fn(k,11,{half:34,elf:39,dwarf:33,wiz:48}[h.key],0,0,true);h.row=row;});
let lastSt='';
function updHud(){
  heroes.forEach(h=>{const u=h.row.querySelector('u');u.style.width=h.hp+'%';u.style.background=h.hp>50?'#6fbf4e':h.hp>25?'#e8b923':'#e0431a';const n=h.row.querySelector('.hpn');const v=h.down?'KO':String(Math.round(h.hp));if(n.textContent!==v)n.textContent=v;h.row.classList.toggle('ko',!!h.down);});
  $('bhp').style.width=(D.hp/D.max*100)+'%';$('bnum').textContent=D.hp+'/'+D.max;
  if(lastSt!==D.st){lastSt=D.st;$('bst').textContent=STN[D.st][0];$('bst').style.color=STN[D.st][1];}
  [['atk',90],['mag',480],['esc',600]].forEach(([k,m])=>{$('cd-'+k).style.width=(cds[k]/m*100)+'%';$('c-'+k).disabled=cds[k]>0||(k==='mag'&&!awake());});
  $('c-sim').disabled=!!sim||emEnvio();
  if(typing.n<typing.full.length){typing.n++;$('txt').textContent=typing.full.slice(0,typing.n);}
  else if(!$('caret')){$('txt').innerHTML='';$('txt').append(typing.full);const s=document.createElement('span');s.id='caret';s.textContent='▼';$('txt').appendChild(s);}
  const cr=$('caret');if(cr)cr.style.visibility=(f>>4)%2?'hidden':'visible';
}
const mini=$('mini'),mk=mini.getContext('2d'),miniBase=mkC(160,100),mb=miniBase.getContext('2d');
(function(){R(mb,0,0,160,100,'#2b302b');for(let i=0;i<500;i++)R(mb,rnd()*160,rnd()*100,1,1,rnd()<.5?'#333a33':'#252a25');
  [[20,40,16],[40,30,14],[62,36,12],[110,22,16],[136,14,18],[150,30,12]].forEach(([x,y,s])=>{tri(mb,x-s,y+s*.8,x+s,y+s*.8,x,y-s*.6,'#5d6370');tri(mb,x,y+s*.8,x+s,y+s*.8,x,y-s*.6,'#4a505b');tri(mb,x-s*.35,y-s*.05,x+s*.35,y-s*.05,x,y-s*.6,'#e9eef6');});
  pl(mb,[[0,70],[30,74],[52,64],[70,80],[96,92]],3,'#3f86d0');
  for(let i=0;i<14;i++){const u=i/13;R(mb,20+u*108,82-u*48+Math.sin(u*6)*4,2,1,'#c8963a');}
  R(mb,14,80,4,3,'#c8963a');R(mb,19,81,3,2,'#8a5a2a');
  R(mb,122,26,14,10,'#8a8f9c');R(mb,120,22,4,14,'#9aa0a8');R(mb,134,22,4,14,'#9aa0a8');tri(mb,119,22,125,22,122,17,'#2f5d5a');tri(mb,133,22,139,22,136,17,'#2f5d5a');R(mb,127,30,4,6,'#f0b84a');})();
function drawMini(){mk.drawImage(miniBase,0,0);if((f>>4)%2){R(mk,96,52,1,6,'#f3f2f2');R(mk,97,52,3,2,'#f3f2f2');}
  const dx=awake()?128+(D.x-HALL.x)/14:129,dy=awake()?30+(D.y-HALL.y)/14:32;R(mk,dx-2,dy-2,4,4,(f>>3)%2||!awake()?'#ff3b1a':'#ffb14a');}

function frame(){f++;updDragon();updChars();updSim();updReal();updFx();
  c.setTransform(1,0,0,1,shake?Math.round((Math.random()-.5)*shake):0,shake?Math.round((Math.random()-.5)*shake):0);
  c.fillStyle='#000';c.fillRect(-4,-4,W+8,H+8);drawWorld();c.setTransform(1,0,0,1,0,0);
  drawMini();updHud();requestAnimationFrame(frame);}

// ---------- comandos e cliques ----------
function cmd(k){
  if(k==='atk'){if(cds.atk)return;cds.atk=90;if(D.st==='sleep'){wake();return;}heroes.forEach(h=>{shoot(h);h.cd=60;});say('Comando','Ataque em grupo! Todos miram no dragão.');}
  if(k==='mag'){if(cds.mag||!awake())return;cds.mag=480;beam=36;heroes[3].act=1;say(heroes[3].name,'Luz da torre branca, rompa as escamas!');}
  if(k==='esc'){if(cds.esc)return;cds.esc=600;shield=300;say(heroes[3].name,'Escudo erguido! O fogo não passa por aqui.');}
  if(k==='sim')startSim();}
['atk','mag','esc','sim'].forEach(k=>$('c-'+k).addEventListener('click',()=>cmd(k)));
addEventListener('keydown',e=>{const k={'1':'atk','2':'mag','3':'esc','4':'sim',' ':'atk'}[e.key];if(k){e.preventDefault();cmd(k);}});
const toScene=e=>{const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};};
function pick(p){if(D.segs.slice(0,16).some((s,i)=>Math.hypot(s[0]-p.x,s[1]-p.y)<rad(i)+5))return{t:'dragon'};
  const h=heroes.find(h=>Math.abs(p.x-h.x)<9&&p.y>h.y-44&&p.y<h.y+2);if(h)return{t:'char',o:h};
  const gd=guards.find(gd=>Math.abs(p.x-gd.x)<6&&p.y>gd.y-14&&p.y<gd.y+2);if(gd)return{t:'char',o:gd};
  if(p.x>300&&p.x<470&&p.y>56&&p.y<178)return{t:'hall'};return null;}
cv.addEventListener('pointermove',e=>{cv.style.cursor=pick(toScene(e))?'pointer':'default';});
cv.addEventListener('click',e=>{const r=pick(toScene(e));if(!r)return;
  if(r.t==='dragon'){if(D.st==='sleep')wake();else cmd('atk');}
  else if(r.t==='char')say(r.o.name,r.o.line+(r.o.down?' (Estou no chão, já levanto.)':''));
  else say('Torre VIOS','O covil guarda o sistema. Cada golpe certeiro vira tarefa criada no VIOS.');});
// ---------- eventos reais do Sam (GET /eventos; contrato em doc/vila/contrato-eventos.md) ----------
// Servida em /vila/sam, a cena assiste aos envios: a missão avança a cada etapa, o dragão desperta
// quando as tarefas começam a ser criadas e cada tarefa gravada tira vida dele. Aberta como arquivo
// solto (sem o servidor), fica só a demonstração.
const AO_VIVO=/\/vila\/sam\/?$/.test(location.pathname);
let desde=0,primeira=true,fila=[],proximo=0;
const totalTarefas=cis=>(cis||[]).filter(x=>x.status==='pronta').reduce((n,x)=>n+String(x.tarefa||'').split(' + ').length,0);
function setQ4(){$('q4').querySelector('b').textContent=real&&real.total?`Tarefas criadas ${Math.min(real.feitas,real.total)}/${real.total}`:'Tarefas criadas';}
function updReal(){
  if(fila.length&&f>=proximo){aplicar(fila.shift(),true);proximo=f+75;}
  if(emEnvio()&&real.total)D.hp=Math.round(D.max*(1-Math.min(1,real.feitas/real.total)));
}
function aplicar(e,vivo){
  if(e.bot&&e.bot!=='ultron')return;
  const [hal,arc,dwa,wiz]=heroes,fala=(q,t)=>{if(vivo)say(q,t);},faixa=t=>{if(vivo)banner(t);};
  if(!real||real.envio!==e.envio)real={envio:e.envio,total:0,feitas:0,modo:'',fim:null,cont:{}};
  if(sim&&vivo){sim=null;}
  switch(e.tipo){
    case 'arquivo_subido':Object.assign(real,{total:0,feitas:0,fim:null});if(!e.automatico)real.modo='';
      if(e.automatico){quest(1,`${e.intimacoes||0} intimação(ões) capturada(s)`);
        fala(hal.name,e.intimacoes?`Trouxe ${e.intimacoes} intimação(ões) do VIOS. Entrego ao oráculo para analisar.`:'Nenhuma intimação nova hoje. Missão encerrada cedo.');break;}
      quest(1,'Conferindo o pergaminho');
      fala(hal.name,`Chegou um TXT na Doca 01${e.arquivo?': '+e.arquivo:''}. Levo para a conferência.`);break;
    case 'conferido':real.total=totalTarefas(e.cis)||e.prontas||0;real.fim=null;quest(2,`${e.prontas||0} pronta(s) · ${e.com_problema||0} com problema`);
      fala(arc.name,`Conferi o pergaminho: ${e.prontas||0} CI(s) pronta(s), ${e.com_problema||0} com problema, ${e.ja_lancadas||0} já lançada(s).`);break;
    case 'envio_iniciado':Object.assign(real,{modo:e.modo||'gravar',feitas:0,fim:null});
      if(e.automatico){quest(0,'O Sam acordou: envio automático');fala(wiz.name,e.modo==='teste'?'Envio automático em ensaio: faço tudo, mas nada é gravado.':'O Sam foi ativado! Capturo, analiso e crio as tarefas, tudo sozinho.');break;}
      quest(2,e.modo==='teste'?'Ensaio: nada é gravado':'Rumo à Torre VIOS');
      fala(wiz.name,e.modo==='teste'?'Um ensaio: vamos até o quadro, sem gravar nada.':'Partimos para a Torre VIOS!');break;
    case 'fase':
      if(e.fase==='capturando'){quest(0,'Capturando intimações');fala(dwa.name,'Abrindo os portões da Torre VIOS e buscando as intimações sem tarefa...');}
      else if(e.fase==='analisando'){quest(1,'A IA está analisando');fala(arc.name,'O oráculo lê cada intimação e escolhe tarefa e prazo. As datas, quem calcula é o código.');}
      else if(e.fase==='entrando_vios'){quest(2,'Entrando no VIOS');fala(dwa.name,'Abrindo os portões da Torre VIOS...');}
      else if(e.fase==='conferindo_duplicatas'){quest(2,'Conferindo duplicatas');fala(wiz.name,'Confiro duplicatas antes de enfrentar o dragão. Nenhuma tarefa repetida passa.');}
      else if(e.fase==='criando_tarefas'){quest(3,real.modo==='teste'?'Ensaio no quadro':'Criando tarefas');if(vivo){if(D.st==='sleep')wake();else say('Torre VIOS','RAAAWR! Quem ousa bater na Torre VIOS?');}}
      break;
    case 'ci':{
      const quem=heroes[(real.feitas+1)%4].name,nome=e.tarefa?`${e.ci}: ${e.tarefa}`:e.ci;
      if(e.etapa==='gravada'||(e.etapa==='no_quadro'&&real.modo==='teste')){real.feitas++;
        faixa(`Tarefa ${Math.min(real.feitas,real.total||real.feitas)}/${real.total||'?'} ${real.modo==='teste'?'no quadro':'criada'}`);
        fala(quem,real.modo==='teste'?`CI ${nome} chegou ao quadro (ensaio, não grava).`:`CI ${nome} gravada e conferida no VIOS.`);
        if(vivo&&awake()){const s=D.segs[7];hitDragon(s[0],s[1],Math.max(4,Math.round(D.max/(real.total||8))),'#fff1a8');}}
      else if(e.etapa==='no_quadro')fala(quem,`CI ${nome} no quadro. Falta gravar.`);
      else if(e.etapa==='erro'){fala('Torre VIOS',`CI ${e.ci}: ${e.motivo||'não deu para lançar'}.`);
        if(vivo&&awake()){const alvo=heroes.filter(h=>!h.down);if(alvo.length){D.target=alvo[Math.random()*alvo.length|0];setSt('dive');}}}
      else if(e.etapa==='ja_tinha')fala(wiz.name,`CI ${e.ci} já tinha tarefa no VIOS. Sigo adiante.`);
      else if(e.etapa==='duplicata')fala(wiz.name,`CI ${e.ci} é cópia de outra: não lanço de novo.`);
      setQ4();break;}
    case 'envio_fim':{const c=e.contagens||{};real.fim=e.resultado||'concluido';real.cont=c;
      if(real.fim==='parou'){quest(3,'Parou');faixa('A missão parou');fala('Guia','O envio parou'+(e.motivo?': '+e.motivo:'.')+' Veja a página do envio.');}
      else if(real.fim==='testado'){quest(4,`Ensaio concluído · ${c.testadas||real.feitas} no quadro`);faixa('Ensaio concluído');fala('Torre VIOS','Ensaio feito: nada foi gravado. Quando quiserem, enviem de verdade.');}
      else{quest(4,`Concluído · ${c.gravadas||0} gravada(s)`);faixa('Missão cumprida');
        fala('Torre VIOS',`${c.gravadas||0} CI(s) gravada(s) no quadro${c.erros?`, ${c.erros} com erro`:''}${c.ja_tinha?`, ${c.ja_tinha} já tinham tarefa`:''}. Volto a guardar a torre.`);}
      if(vivo&&awake()){D.target=null;setSt('return');}
      break;}
  }
  setQ4();
}
function resumo(){
  if(!real){quest(-1,'Aguardando envio');say('Guia','Bem-vindo à Fortaleza. Quando um TXT chegar na página do Sam, a missão começa aqui.');return;}
  const c=real.cont||{};
  if(real.fim==='concluido')say('Guia',`Último envio: ${c.gravadas||0} CI(s) gravada(s) na Torre VIOS${c.erros?`, ${c.erros} com erro`:''}. Aguardando o próximo pergaminho.`);
  else if(real.fim==='testado')say('Guia','Último envio foi um ensaio (nada gravado). Aguardando o próximo pergaminho.');
  else if(real.fim==='parou')say('Guia','O último envio parou no meio. Veja a página do envio.');
  else say('Guia','Há um envio em andamento: a missão segue daqui.');
}
async function puxar(){
  try{const r=await fetch(`/eventos?desde=${desde}`,{cache:'no-store',credentials:'same-origin'});if(!r.ok)throw new Error(r.status);
    const j=await r.json(),ev=(j.eventos||[]).filter(e=>e.n>desde).sort((a,b)=>a.n-b.n);
    if(ev.length)desde=ev[ev.length-1].n;else if(j.ultimo>desde)desde=j.ultimo;
    if(primeira){primeira=false;ev.forEach(e=>aplicar(e,false));resumo();}else fila.push(...ev);
    $('cx').textContent='';
  }catch(_){$('cx').textContent='Sem conexão · tentando de novo';}
  setTimeout(puxar,2000);
}
new ResizeObserver(([en])=>{$('game').style.fontSize=(en.contentRect.width/1100*16)+'px';}).observe($('game'));
buildScene();quest(-1,'Aguardando envio');
if(AO_VIVO)puxar();
else say('Guia','Bem-vindo à Fortaleza. Clique no dragão para despertá-lo, ou use os comandos ao lado. [1] Atacar · [2] Magia · [3] Escudo · [4] Demonstração.');
frame();

</script>
