<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fundo · Arena do Albi</title>
<style>
  html,body{margin:0;height:100%;background:#141312;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{display:block;image-rendering:pixelated;width:min(100vw,calc(100vh * 16 / 9));height:auto;}
</style>
</head>
<body>
<canvas id="c" width="320" height="180"></canvas>
<script>
const cv = document.getElementById('c'), c = cv.getContext('2d');
const W = 320, H = 180, HOR = 86;
const R = (x, y, w, h, col) => { c.fillStyle = col; c.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); };

// nuvens (x, y, w, velocidade)
const clouds = Array.from({ length: 7 }, (_, i) => ({ x: (i * 53) % W, y: 8 + (i * 17) % 44, w: 22 + (i * 9) % 26, s: .06 + (i % 3) * .03 }));
// grama ondulando
const tufts = Array.from({ length: 60 }, (_, i) => ({ x: (i * 37 + 11) % W, y: HOR + 4 + (i * 13) % (H - HOR - 10), f: i * .7 }));
// pássaros
const birds = Array.from({ length: 3 }, (_, i) => ({ x: -20 - i * 60, y: 22 + i * 9, s: .35 + i * .08, f: i * 2 }));

function cloud(x, y, w) {
  R(x, y + 3, w, 5, '#ffffff'); R(x + 3, y, w - 6, 3, '#ffffff'); R(x + w * .3, y - 2, w * .3, 2, '#ffffff');
  R(x + 1, y + 8, w - 2, 1, '#cfe3f2');
}
function spire(x, base, h) {
  // pedestal
  R(x - 5, base - 3, 10, 3, '#5a6c80'); R(x - 4, base - 4, 8, 1, '#8ea3b8');
  // haste afunilando
  for (let i = 0; i < h; i++) {
    const t = i / h, w = Math.max(1, Math.round(4 * (1 - t) + 0.6));
    R(x - (w >> 1), base - 4 - i, w, 1, t > .92 ? '#ffffff' : '#c7d6e4');
    if (w >= 3) R(x - (w >> 1), base - 4 - i, 1, 1, '#eef5fb');
    if (w >= 2) R(x + (w >> 1) - (w % 2 ? 0 : 1), base - 4 - i, 1, 1, '#8ea3b8');
  }
}
function arena(f) {
  // plataforma em perspectiva: topo trapezoidal + lateral
  const top = 112, bot = 150, lx0 = 58, rx0 = 262, lx1 = 28, rx1 = 292;
  // lateral (frente)
  R(lx1, bot, rx1 - lx1, 10, '#4a5a6e'); R(lx1, bot + 10, rx1 - lx1, 4, '#33404f');
  for (let x = lx1 + 8; x < rx1 - 4; x += 24) R(x, bot + 2, 1, 7, '#2e3a48');
  R(lx1, bot, rx1 - lx1, 1, '#8ea3b8');
  // topo
  for (let y = top; y < bot; y++) {
    const t = (y - top) / (bot - top), l = lx0 + (lx1 - lx0) * t, r = rx0 + (rx1 - rx0) * t;
    R(l, y, r - l, 1, '#8ea3b8');
  }
  // ladrilhos
  c.fillStyle = '#6f879e';
  for (let y = top; y < bot; y++) {
    const t = (y - top) / (bot - top), l = lx0 + (lx1 - lx0) * t, r = rx0 + (rx1 - rx0) * t, w = r - l;
    const rowIdx = Math.floor(Math.pow(t, .8) * 7);
    if ([2, 5, 8, 11, 15, 19, 24, 29, 34].includes(y - top)) R(l, y, w, 1, '#5f768c');
    for (let k = 1; k < 10; k++) R(l + w * k / 10, y, 1, 1, '#5f768c');
  }
  // brilho que percorre o piso
  const gx = (f * .6) % (rx1 - lx1 + 60) + lx1 - 30;
  for (let y = top; y < bot; y++) {
    const t = (y - top) / (bot - top), l = lx0 + (lx1 - lx0) * t, r = rx0 + (rx1 - rx0) * t;
    const sx = gx + (y - top) * .4;
    if (sx > l && sx + 3 < r) R(sx, y, 3, 1, 'rgba(255,255,255,.18)');
  }
  // borda do topo
  R(lx0, top, rx0 - lx0, 1, '#eef5fb');
  // sombras na grama
  R(lx1 - 6, bot + 14, rx1 - lx1 + 12, 3, 'rgba(40,70,40,.5)');
  // torres (fundo primeiro)
  const pulse = (f >> 4) % 2;
  spire(lx0 + 8, top + 2, 50); spire(rx0 - 8, top + 2, 50);
  spire(lx1 + 10, bot + 1, 78); spire(rx1 - 10, bot + 1, 78);
  // pontas acesas
  if (pulse) { [[lx0 + 8, top + 2 - 54], [rx0 - 8, top + 2 - 54], [lx1 + 10, bot + 1 - 82], [rx1 - 10, bot + 1 - 82]].forEach(([x, y]) => { R(x - 1, y, 3, 1, '#ffffff'); R(x, y - 1, 1, 3, '#ffffff'); }); }
}

let f = 0;
function frame() {
  f++;
  // céu em faixas
  const sky = ['#5aa7e6', '#6db4ec', '#82c1f1', '#9bcff6', '#b7ddf9'];
  sky.forEach((col, i) => R(0, i * (HOR / sky.length), W, HOR / sky.length + 1, col));
  // nuvens
  clouds.forEach(n => { n.x += n.s; if (n.x > W + 10) n.x = -n.w - 10; cloud(n.x, n.y, n.w); });
  // pássaros
  birds.forEach(b => {
    b.x += b.s; if (b.x > W + 20) { b.x = -30; }
    const up = Math.floor((f + b.f * 10) / 8) % 2;
    R(b.x, b.y + (up ? 0 : 1), 2, 1, '#2b3a4a'); R(b.x + 2, b.y + (up ? 1 : 0), 2, 1, '#2b3a4a'); R(b.x + 4, b.y + (up ? 0 : 1), 2, 1, '#2b3a4a');
  });
  // montanhas ao fundo
  R(0, HOR - 14, W, 14, '#7fb0a0');
  [[0, 40, 10], [60, 70, 16], [150, 50, 9], [220, 90, 18], [300, 40, 12]].forEach(([x, w, h]) => {
    for (let i = 0; i < h; i++) { const k = h - 1 - i; R(x + k * (w / h / 2), HOR - 14 - h + i, w - k * (w / h), 1, '#6a9a8a'); }
  });
  // mesas de pedra (rochedos chatos)
  [[8, 36, 22], [262, 44, 24]].forEach(([x, w, h]) => {
    R(x, HOR - h, w, h, '#c99a5a'); R(x + 2, HOR - h - 3, w - 4, 3, '#7fc45e'); R(x + 2, HOR - h, w - 4, 1, '#a97b43');
    for (let i = 0; i < 4; i++) R(x + 3 + i * (w / 4), HOR - h + 4 + (i % 2) * 5, 2, h - 8, '#a97b43');
  });
  // campo
  R(0, HOR, W, H - HOR, '#6fbf4e');
  R(0, HOR, W, 10, '#86cf62');
  // estrada sinuosa até o horizonte
  for (let y = HOR; y < H; y++) {
    const t = (y - HOR) / (H - HOR), x = W / 2 + Math.sin(t * 4.5) * 30 * (1 - t) + 20 * (1 - t), w = 2 + t * 26;
    R(x - w / 2, y, w, 1, '#d9c89a');
    if (y % 6 === 0) R(x - 1, y, 2, 1, '#efe3bf');
  }
  // lago
  R(190, HOR + 6, 48, 6, '#58a8e0'); R(194, HOR + 5, 40, 1, '#8fd0f5'); if ((f >> 3) % 2) R(200 + (f >> 2) % 20, HOR + 8, 4, 1, '#bde6fb');
  // grama ondulando
  tufts.forEach(g => { const sway = Math.round(Math.sin(f * .08 + g.f)); if (g.y > 112 && g.y < 165 && g.x > 20 && g.x < 300) return; R(g.x, g.y, 1, 2, '#4f9c3a'); R(g.x + sway, g.y - 1, 1, 1, '#4f9c3a'); });
  // arena
  arena(f);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
