<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zangão · robô que vira carro</title>
<style>
  html,body{margin:0;height:100%;background:#141312;overflow:hidden;}
  body{display:flex;align-items:center;justify-content:center;}
  canvas{display:block;image-rendering:pixelated;width:min(100vw,calc(100vh * 16 / 9));height:auto;}
  #hint{position:fixed;left:0;right:0;top:3vh;text-align:center;color:#a9a49b;font:13px/1.4 system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;pointer-events:none;}
</style>
</head>
<body>
<canvas id="c" width="160" height="90"></canvas>
<div id="hint">Clique em qualquer ponto · ele vira carro para ir até lá</div>
<script>
// ---------- sprites (1 char = 1 pixel) ----------
const ROBOT = [ // 24 x 26, de frente
  '.........KKKKKK.........',
  '........KYYYYYYK........',
  '.......KYYYYYYYYK.......',
  '.......KYKKKKKKYK.......',
  '.......KYKBEBEKYK.......',
  '.......KYKKKKKKYK.......',
  '........KYGGGGYK........',
  '.........KKKKKK.........',
  'LLLL....KKYYYYKK....LLLL',
  'LBBL...KYYYYYYYYK...LBBL',
  'LBBL..KYYYKKKKYYYK..LBBL',
  'LBBL..KYYKWWWWKYYK..LBBL',
  'LLLL..KYYKGGGGKYYK..LLLL',
  '..K...KYYYKKKKYYYK...K..',
  '..KKKKKYYYYYYYYYYKKKKK..',
  '..KYYKKYYYYYYYYYYKKYYK..',
  '..KYYK.KKKKKKKKKK.KYYK..',
  '..KYYK.KYYYKKYYYK.KYYK..',
  '..KKKK.KYYYK.KYYYK.KKKK.',
  '.......KYYYK.KYYYK......',
  '.......KYYYK.KYYYK......',
  '.......KKKKK.KKKKK......',
  '.......KGGGK.KGGGK......',
  '.......KGGGK.KGGGK......',
  '......KKKKKK.KKKKKK.....',
  '......KDDDDK.KDDDDK.....'
];
const CAR = [ // 30 x 12, de lado, frente para a direita
  '..............................',
  '..............................',
  '.........KKKKKKKKKKKK.........',
  '.......KKBBBBBBBBBBBBKK.......',
  '......KYBBBBBBBBBBBBBBYK......',
  '.....KYYKKKKKKKKKKKKKKYYKK....',
  '..KKKYYYYYYYYYYYYYYYYYYYYYKKK.',
  '.KYYYYYYYYYYYYYYYYYYYYYYYYYYHK',
  '.KYYYYYYYYYYYYYYYYYYYYYYYYYYRK',
  '.KKKKKKKKKKKKKKKKKKKKKKKKKKKKK',
  '...KDDK..............KDDK.....',
  '...KDDK..............KDDK.....'
];
const PAL = { Y:'#e8b923', H:'#fff1a8', K:'#1d1e21', B:'#3d8bff', E:'#cfeaff', W:'#8fc3e0', G:'#8c939c', L:'#5a616b', D:'#4a4f57', R:'#ff5a3c' };

// peças: região do robô -> região do carro (x,y relativos ao centro/chão). Cada peça desliza e gira até encaixar.
// rx,ry,rw,rh = recorte no sprite ROBOT; cx,cy = destino (canto sup-esq) no carro; rot = voltas de giro no caminho
const PARTS = [
  { n:'cabeca',  rx:7, ry:0,  rw:10, rh:8,  cx:9,   cy:2,  rot:0.5, d:0.00 },
  { n:'peito',   rx:6, ry:8,  rw:12, rh:9,  cx:-2,  cy:6,  rot:0,   d:0.08 },
  { n:'asaE',    rx:0, ry:8,  rw:4,  rh:5,  cx:-9,  cy:3,  rot:1,   d:0.12 },
  { n:'asaD',    rx:20,ry:8,  rw:4,  rh:5,  cx:6,   cy:3,  rot:1,   d:0.12 },
  { n:'bracoE',  rx:2, ry:13, rw:4,  rh:6,  cx:-15, cy:6,  rot:0.5, d:0.18 },
  { n:'bracoD',  rx:18,ry:13, rw:4,  rh:6,  cx:11,  cy:6,  rot:0.5, d:0.18 },
  { n:'pernaE',  rx:7, ry:17, rw:5,  rh:9,  cx:-12, cy:8,  rot:0.25,d:0.26 },
  { n:'pernaD',  rx:13,ry:17, rw:5,  rh:9,  cx:6,   cy:8,  rot:0.25,d:0.26 }
];
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const cv = document.getElementById('c'), c = cv.getContext('2d');
const GROUND = 80, SPEED = 0.6;
const b = { x: 68, y: GROUND, tx: 68, mode: 'robot', m: 0, dir: 1, t: 0 }; // m: 0 robô … 1 carro
addEventListener('click', e => { const r = cv.getBoundingClientRect(); b.tx = Math.max(16, Math.min(144, Math.round((e.clientX - r.left) / r.width * 160))); });

function blit(rows, x, y, pal, flip) {
  const w = rows[0].length;
  rows.forEach((r, j) => r.split('').forEach((ch, i) => {
    if (ch === '.') return;
    c.fillStyle = pal[ch] || PAL[ch];
    c.fillRect(x + (flip ? w - 1 - i : i), y + j, 1, 1);
  }));
}

let f = 0;
function loop() {
  f++; b.t++;
  const dist = b.tx - b.x, moving = Math.abs(dist) > 1;
  if (moving) b.dir = Math.sign(dist);
  // transformação: 1 = carro quando em movimento, 0 = robô quando parado
  const target = moving ? 1 : 0;
  b.m += (target - b.m) * 0.07;
  const car = b.m > 0.9;
  if (car && moving) b.x += b.dir * Math.min(SPEED * (0.5 + b.m), Math.abs(dist)); // só anda quando já é carro

  // fundo
  c.fillStyle = '#141312'; c.fillRect(0, 0, 160, 90);
  c.fillStyle = '#25282d'; c.fillRect(0, GROUND, 160, 10);
  for (let i = 0; i < 160; i += 16) { c.fillStyle = '#33373e'; c.fillRect(i + 1, GROUND + 1, 14, 1); }
  for (let i = 0; i < 8; i++) { c.fillStyle = '#b68235'; c.fillRect(((i * 23 + f * .2) % 160) | 0, GROUND + 5, 3, 1); }
  // marcador do destino
  if (moving) { c.fillStyle = (f >> 3) % 2 ? '#f0c46a' : '#b68235'; c.fillRect(b.tx - 1, GROUND - 3, 3, 1); c.fillRect(b.tx, GROUND - 4, 1, 3); }

  const x = Math.round(b.x), tr = b.m > 0.04 && b.m < 0.9; // em transformação
  if (tr) {
    const k = b.m; // 0 robô -> 1 carro
    const flip = b.dir < 0;
    // silhueta-guia do carro surgindo por baixo (chassi)
    c.globalAlpha = Math.max(0, k - .5) * 1.6;
    blit(CAR, x - 15, GROUND - 12, PAL, flip);
    c.globalAlpha = 1;
    PARTS.forEach(p => {
      const t = ease(Math.max(0, Math.min(1, (k - p.d) / (0.9 - p.d))));
      // origem (robô) e destino (carro), centros das peças
      const ox = x - 12 + p.rx + p.rw / 2, oy = GROUND - 26 + p.ry + p.rh / 2;
      const cxm = flip ? -(p.cx + p.rw) : p.cx;
      const dx = x + cxm + p.rw / 2, dy = GROUND - 12 + p.cy + p.rh / 2;
      const px = ox + (dx - ox) * t, py = oy + (dy - oy) * t - Math.sin(t * Math.PI) * 6; // arco
      // giro em passos de 90° para manter o pixel art nítido
      const steps = Math.round(p.rot * 4 * t) * (flip ? -1 : 1);
      const ang = steps * Math.PI / 2;
      c.save();
      c.translate(Math.round(px), Math.round(py));
      c.rotate(ang);
      c.globalAlpha = 1 - Math.max(0, (t - .85) / .15); // some ao encaixar no chassi
      const hw = p.rw >> 1, hh = p.rh >> 1;
      for (let j = 0; j < p.rh; j++) for (let i = 0; i < p.rw; i++) {
        const ch = ROBOT[p.ry + j][p.rx + i]; if (ch === '.') continue;
        c.fillStyle = PAL[ch]; c.fillRect(i - hw, j - hh, 1, 1);
      }
      c.restore();
    });
    // rodas descem do chassi
    const wk = Math.max(0, (k - .55) / .45);
    c.fillStyle = PAL.D;
    c.fillRect(x - 12, GROUND - 2 - Math.round((1 - wk) * 6), 4, 2);
    c.fillRect(x + 7, GROUND - 2 - Math.round((1 - wk) * 6), 4, 2);
    c.globalAlpha = 1;
  } else if (car) {
    const bob = (f >> 2) % 2 && moving ? -1 : 0;
    const pal = Object.assign({}, PAL, { D: (f >> 1) % 2 && moving ? '#6b727b' : PAL.D });
    blit(CAR, x - 15, GROUND - 12 + bob, pal, b.dir < 0);
    // farol e rastro
    const fx = b.dir > 0 ? x + 15 : x - 16;
    c.fillStyle = 'rgba(255,241,168,.35)'; c.fillRect(fx, GROUND - 5, b.dir > 0 ? 10 : 1, 2); if (b.dir < 0) c.fillRect(fx - 9, GROUND - 5, 10, 2);
    if (moving) for (let i = 0; i < 4; i++) { c.fillStyle = 'rgba(169,164,155,.5)'; c.fillRect(x - b.dir * (16 + i * 4) - ((f + i * 3) % 4), GROUND - 2 - (i % 2), 2, 1); }
  } else {
    const idle = (f >> 4) % 2, blink = f % 180 < 6;
    const pal = Object.assign({}, PAL, { E: blink ? PAL.K : PAL.E, B: blink ? PAL.K : PAL.B });
    // asas-porta balançam no idle
    const wing = idle ? 1 : 0;
    blit(ROBOT, x - 12, GROUND - 26, pal, false);
    if (wing) { c.fillStyle = PAL.L; c.fillRect(x - 13, GROUND - 19, 1, 1); c.fillRect(x + 12, GROUND - 19, 1, 1); }
    // brilho dos olhos
    if (!blink) { c.fillStyle = 'rgba(61,139,255,.35)'; c.fillRect(x - 3, GROUND - 23, 7, 3); }
  }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
